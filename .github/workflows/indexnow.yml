# Une fois la mise en prod en ligne : signale à Bing (IndexNow) les articles Conseils modifiés (scripts/indexnow.mjs)
# et renvoie le plan du site à Google (scripts/gsc-stats.mjs plan, secret GitHub GSC_SERVICE_ACCOUNT_JSON).
# Lancement à la main possible (onglet Actions, « Run workflow ») : seul le plan du site est alors renvoyé.
name: Indexation — articles Conseils (Bing et Google)
on:
  push:
    branches: [main]
    paths: ["content/conseils/**"]
  workflow_dispatch:
jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Attendre la fin du déploiement Vercel
        run: sleep 240
      - name: Signaler les articles modifiés à Bing
        run: node scripts/indexnow.mjs $(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- content/conseils)
      - name: Renvoyer le plan du site à Google
        run: node scripts/gsc-stats.mjs plan
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
